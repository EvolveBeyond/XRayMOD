name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release notes hint
        run: |
          echo "Creating GitHub release for ${{ steps.ver.outputs.version }}"
          echo "Ensure CHANGELOG.md contains this version section."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: XRayMOD ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            ## XRayMOD ${{ steps.ver.outputs.version }}

            See [CHANGELOG.md](https://github.com/askarniroomand/XRayMOD/blob/main/CHANGELOG.md) for details.

            ### Breaking (1.9.12+)
            Panel / API / subscription URLs require **SECURE PATH**:
            `https://YOUR.workers.dev/{SECURE_PATH}/panel`

            Bare `/panel` and `/sub/...` return **404**. Re-share subscription links after upgrade.

            ### Install

            **Linux / macOS / WSL**
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/askarniroomand/XRayMOD/main/install.sh)
            ```

            **Windows PowerShell**
            ```powershell
            irm https://raw.githubusercontent.com/askarniroomand/XRayMOD/main/install.ps1 | iex
            ```

            ### Clients
            v2rayNG ≥ 2.2.3 (enable Hev TUN) · sing-box ≥ 1.12.0

            ### Security
            Never share Cloudflare API tokens or your SECURE PATH URL in issues or chats.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
